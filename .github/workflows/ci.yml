name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push cancels a PR's older run; every main commit gets its own group, so it keeps its CI result.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm types
      - run: pnpm build
      - name: Committed OpenAPI document matches the code
        run: pnpm openapi && git diff --exit-code docs/openapi.json
      # The db tests start Postgres with testcontainers, using the runner's Docker.
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: docker compose up --build --wait
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
