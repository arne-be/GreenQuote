services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greenquote
      POSTGRES_PASSWORD: greenquote
      POSTGRES_DB: greenquote
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenquote"]
      interval: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
