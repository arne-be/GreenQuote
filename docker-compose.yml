services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greenquote
      POSTGRES_PASSWORD: greenquote
      POSTGRES_DB: greenquote
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenquote"]
      interval: 2s
      retries: 15
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://greenquote:greenquote@db:5432/greenquote
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://greenquote:greenquote@db:5432/greenquote
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
    environment:
      API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
